# Publication automatique de l'appli sur GitHub Pages (https://sac2riz.github.io/Sac2Riz/).
#
# À chaque push sur main (ou lancement à la main depuis l'onglet Actions) :
#   1. « construire » : installe les outils (npm ci), vérifie tout (npm run check : types + tests),
#      compile (npm run build) et prépare le dossier dist/ pour GitHub Pages ;
#   2. « publier » : met en ligne ce dist/ — SEULEMENT si toute la première partie a réussi.
# Si un test échoue, rien n'est publié : la version en ligne reste la précédente.
# Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions ».

name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Droits minimaux : lire le dépôt, publier sur Pages (id-token : preuve d'identité exigée par Pages)
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; une publication en cours n'est pas interrompue
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code (avec tout l'historique : date du build, voir scripts/date-build.ts)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Installer les dépendances (versions exactes de package-lock.json)
        run: npm ci

      - name: Vérifier (types + tests)
        run: npm run check

      - name: Compiler
        run: npm run build

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Envoyer dist/
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: publication
        uses: actions/deploy-pages@v5
