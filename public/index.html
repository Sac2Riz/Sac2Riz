<!doctype html>
<html lang="fr" data-style="retro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Sécurité : la page ne charge que ses propres fichiers (aucune ressource externe, aucun tracking) -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; worker-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3e9d2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2a1d14" media="(prefers-color-scheme: dark)">
  <title>Sac2Riz</title>
  <!-- Chemins relatifs (./) : l'appli fonctionne aussi dans un sous-dossier (GitHub Pages) -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icones/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles/theme.css">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/icones.css">
  <!-- Styles au choix (réglage « Style ») : chacun actif selon <html data-style> ; Ardoise = theme.css -->
  <link rel="stylesheet" href="./styles/visuels/ascii.css">
  <link rel="stylesheet" href="./styles/visuels/ascii-generatif.css">
  <link rel="stylesheet" href="./styles/visuels/bbs-ansi.css">
  <link rel="stylesheet" href="./styles/visuels/ms-dos.css">
  <link rel="stylesheet" href="./styles/visuels/retro.css">
  <!-- Style et thème choisis posés AVANT le premier affichage (script classique, bloquant) -->
  <script src="./demarrage.js"></script>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <main id="app" class="app">
    <noscript>Sac2Riz a besoin de JavaScript pour fonctionner.</noscript>
  </main>
</body>
</html>
