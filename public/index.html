<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Sécurité : la page ne charge que ses propres fichiers (aucune ressource externe, aucun tracking) -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; worker-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1d21" media="(prefers-color-scheme: dark)">
  <title>Sac2Riz</title>
  <!-- Chemins relatifs (./) : l'appli fonctionne aussi dans un sous-dossier (GitHub Pages) -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icones/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles/theme.css">
  <link rel="stylesheet" href="./styles/base.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <main id="app" class="app">
    <noscript>Sac2Riz a besoin de JavaScript pour fonctionner.</noscript>
  </main>
</body>
</html>
